<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ArXiv PDF Renamer</h1>
    </header>

    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>Inspecting ArXiv page...</p>
    </div>

    <div id="result" class="state hidden">
      <label for="title-input">Paper Title</label>
      <input type="text" id="title-input" readonly>
      <p id="download-status" class="history-status"></p>

      <div class="template-row">
        <label for="version-select">PDF Version</label>
        <select id="version-select">
          <option value="latest">Latest available version</option>
          <option id="current-version-option" value="current">
            Version from current URL
          </option>
        </select>
      </div>

      <div class="template-row">
        <label for="conflict-select">If Filename Exists</label>
        <select id="conflict-select">
          <option value="uniquify">Keep both files</option>
          <option value="overwrite">Overwrite existing file</option>
          <option value="prompt">Ask each time</option>
        </select>
      </div>

      <div class="template-row">
        <label for="save-mode-select">Save Location</label>
        <select id="save-mode-select">
          <option value="ask">Ask where to save</option>
          <option value="folder">Use remembered folder</option>
        </select>
        <div class="save-location-line">
          <span id="save-location-status">Chrome download location</span>
          <button id="folder-settings-btn" class="small-button" type="button">
            Configure
          </button>
        </div>
      </div>

      <div class="template-row">
        <label for="template-select">Filename Format</label>
        <select id="template-select">
          <option value="default">[YYYY.MM] Title</option>
          <option value="short">[YY.MM] Title</option>
          <option value="title">Title only</option>
          <option value="custom">Custom template</option>
        </select>
      </div>

      <div id="custom-template-row" class="template-row hidden">
        <label for="custom-template">Custom Template</label>
        <input
          type="text"
          id="custom-template"
          placeholder="[{year}.{month}] {firstAuthor} - {title}"
        >
        <p class="token-help">
          Tokens: {title}, {firstAuthor}, {authors}, {year}, {year2},
          {month}, {arxivId}, {category}
        </p>
        <p id="template-error" class="field-error hidden"></p>
      </div>

      <label>Filename Preview</label>
      <div id="filename-preview" class="filename-preview"></div>

      <button id="download-btn">Download PDF</button>
    </div>

    <div id="batch-result" class="state hidden">
      <div class="batch-header">
        <label class="checkbox-label">
          <input type="checkbox" id="batch-select-all" checked>
          Select all
        </label>
        <span id="batch-summary"></span>
      </div>
      <div id="batch-list" class="batch-list"></div>
      <p id="batch-progress" class="batch-progress hidden"></p>
      <button id="batch-download-btn">Download Selected</button>
    </div>

    <div id="error" class="state hidden">
      <p id="error-msg" class="error-text"></p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
